<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Relative</title>
</head>

<body>
    <style>
        .box {
            width: 400px;
            height: 200px;
            background-color: tomato;
            position: relative;
        }
        .box:hover{
            top: 20px;
            left: 20px;
        }

        .box-2 {
            width: 400px;
            height: 100px;
            background-color: steelblue;
            /* Khối màu xanh làm mốc */
        }
    </style>
    <h1>Position Relative</h1>
    <div class="box">Box 1 (Relative)</div>
    <div class="box-2">Box 2 (Mặc định)</div>
</body>

</html>
