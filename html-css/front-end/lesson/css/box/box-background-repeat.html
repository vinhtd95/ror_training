<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background size</title>
</head>
<body>
    <style>
        #wrapper{
            width: 960px;
            margin: 0px auto;
        }
        .box{
            background-color: bisque;
            min-height: 300px;
            background-image: url("../image/icon-setting.jpg");
            background-size: 80px;
            background-repeat: no-repeat;
        }
    </style>
    <div id="wrapper">
        <h1>Background repeat</h1>
        <div class="box">
        </div>
    </div>  
</body>
</html>
