<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Margin</title>
</head>
<body>
    <style>
        .box{
            text-align: center;
            width: 500px;
            padding: 50px 20px;
            background: greenyellow;
            margin-bottom: 15px;
        }

        .bg-red{
            background: red;
        }
        .mb{
            margin-bottom: 20px;
        }
    </style>
    <h1>Box margin</h1>
    <div class="box mb">
        A
    </div>
    <div class="box bg-red">
        B 
    </div>
    
</body>
</html>
