<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Shadow</title>
</head>
<body>
    <style>
        .box{
            width: 200px;
            height: 100px;
            margin-left: 100px;
            background-color: tomato;
            box-shadow: 15px 15px 5px gray;
        }
    </style>
    <h1>Box shadow</h1>
    <div class="box">Box 1</div>
</body>
</html>
