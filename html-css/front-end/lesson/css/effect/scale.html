<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale</title>
</head>
<body>
    <style>
        .box{
            width: 200px;
            padding: 50px;
            background-color: tomato;
            text-align: center;
            text-transform: uppercase;
        }
        .box:hover{
            margin-left: 200px;
            margin-top: 200px;
            transform: scale(2,2) rotate(360deg);
            transition: all 2s;
        }
    </style>
    <h2>Scale Css</h2>
    <div class="box">Box</div>
</body>
</html>
