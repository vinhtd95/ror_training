<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Selector</title>
</head>
<body>
    <style>
        .text-center{
            text-align: center;
        }
        #header{
            text-align:center;
            background: #333;
            color: #fff
        }
        #wrapper{
            width: 960px;
            margin: 0px auto;
        }
        #content{
            min-height: 500px;
        }
        #footer{
            background:#333;
            color: #fff;
        }
    </style>
    <!-- <h1>Id selector </h1> -->
    <div id="wrapper">
        <div id="header">
            <h2>Header</h2>
        </div>
        <div id="content">
            <p>Content</p>
        </div>
        <div id="footer" class="text-center">
            <p>Footer</p>
        </div>
    </div>
</body>
</html>
