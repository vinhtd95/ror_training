<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owl Carousel Slider Demo</title>

    <!-- Owl Carousel CSS -->
    <link rel="stylesheet" href="owlcarousel/assets/owl.carousel.min.css">
    <link rel="stylesheet" href="owlcarousel/assets/owl.theme.default.min.css">
    <script src="jquery.min.js"></script>
    <script src="owlcarousel/owl.carousel.min.js"></script>

</head>

<body>
    <script>
        $(document).ready(function () {
            $('.owl-carousel').owlCarousel({
                loop: true,
                margin: 10,
                nav: true,
                responsive: {
                    0: {
                        items: 1
                    },
                    600: {
                        items: 3
                    },
                    1000: {
                        items: 5
                    }
                }
            })
        });
    </script>
    <div class="owl-carousel owl-theme">
    <div class="item">
        <img src="images/images1.jpg" alt="Slide 1">
    </div>
    <div class="item">
        <img src="images/images2.jpg" alt="Slide 2">
    </div>
    <div class="item">
        <img src="images/images3.jpg" alt="Slide 3">
    </div>
    <div class="item">
        <img src="images/images4.jpg" alt="Slide 4">
    </div>
    <div class="item">
        <img src="images/images5.jpg" alt="Slide 5">
    </div>
    <div class="item">
        <img src="images/images6.jpg" alt="Slide 6">
    </div>
</div>

</body>

</html>
